name: Dependency security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: https://git.nmulti.cloud/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: https://git.nmulti.cloud/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Activate the pinned pnpm release
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit every dependency
        run: pnpm audit --audit-level=low
      - name: Lint the application
        run: pnpm lint
      - name: Type-check the application
        run: pnpm exec tsc --noEmit
      - name: Build the static export
        run: pnpm build
